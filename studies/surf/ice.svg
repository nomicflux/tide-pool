<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
<title>Tide Pool — a coast that remembers</title>
<rect width="1100" height="480" fill="#3e6475"/>
<g fill="#ead9af" font-family="Georgia, serif">
<text x="65" y="75" font-size="32">A coast that remembers</text>
<text x="65" y="110" font-size="16">ice water</text>
<circle cx="110" cy="175" r="3"/>
<text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">moon</tspan></text>
<circle cx="320" cy="187" r="3"/>
<text x="320" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">lantern</tspan></text>
<circle cx="530" cy="199" r="3"/>
<text x="530" y="229" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="530" dy="0">salt</tspan></text>
<circle cx="740" cy="175" r="3"/>
<text x="740" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="740" dy="0">window</tspan></text>
<circle cx="950" cy="187" r="3"/>
<text x="950" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="950" dy="0">rain</tspan></text>
<circle cx="110" cy="299" r="3"/>
<text x="110" y="329" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">home</tspan></text>
