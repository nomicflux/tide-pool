<title id="title">A coast that remembers</title>
<desc id="desc">A map of the fictional coast. The lighthouse and observatory stand on the headland; a jetty reaches west from the harbour. The village lies east, the old station south, and the wrack line and crab's house southwest. Numbers match the thirty-eight places on the story chart.</desc>
