<svg xmlns="http://www.w3.org/2000/svg" width="720" height="182" viewBox="0 0 720 182"><title>Bob</title><rect width="720" height="182" fill="#0b1a24"/><rect x="24" y="40" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">B</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">bring a plank with your name on it becomes one plank for every letter</text><rect x="24" y="74" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">O</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">over the water I carried it becomes the last letter is yours to bring</text><rect x="24" y="108" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">B</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">beside your name I left room for the next keeper waits beneath Bob, here is the last plank</text></svg>