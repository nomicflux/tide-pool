<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250"><title>Alice</title><rect width="720" height="250" fill="#0b1a24"/><rect x="24" y="40" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">A</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">and cork listens</text><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">L</text><rect x="24" y="108" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">I</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">I found the kettle warm and left the lamp lit for you dreams of a cup set beside the lamp</text><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">C</text><text x="36" y="198" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text></svg>