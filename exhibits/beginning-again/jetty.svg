<svg xmlns="http://www.w3.org/2000/svg" width="825" height="386" viewBox="0 0 825 386"><title>beginning</title><rect width="825" height="386" fill="#0b1a24"/><rect x="24" y="40" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">B</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">bring a plank with your name on it becomes one plank for every letter</text><rect x="24" y="74" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">every light needs someone to return shelters and so I came back with a lantern</text><rect x="24" y="108" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">G</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">gulls write the first word on the sand becomes grey water warms toward morning</text><rect x="24" y="142" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">I</text><text x="64" y="161" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">I found the kettle warm and left the lamp lit for you dreams of a cup set beside the lamp</text><rect x="24" y="176" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="198" fill="#ead9af" font-size="18" font-family="Georgia, serif">N</text><text x="64" y="195" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">nothing ends where a lamp is lit remembers new planks smell of salt and pine</text><rect x="24" y="210" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="232" fill="#ead9af" font-size="18" font-family="Georgia, serif">N</text><text x="64" y="229" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">no name disappears while someone is calling it remembers night keeps a place for the returning boat</text><rect x="24" y="244" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="266" fill="#ead9af" font-size="18" font-family="Georgia, serif">I</text><text x="64" y="263" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">I am still here waits beneath I am still here</text><rect x="24" y="278" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="300" fill="#ead9af" font-size="18" font-family="Georgia, serif">N</text><text x="64" y="297" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">nobody remembers which of us arrived first waits beneath next morning the footprints start at the water</text><rect x="24" y="312" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="334" fill="#ead9af" font-size="18" font-family="Georgia, serif">G</text><text x="64" y="331" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">gather the bottles, read them twice waits beneath going out is how we come back</text></svg>