<svg xmlns="http://www.w3.org/2000/svg" width="776" height="250" viewBox="0 0 776 250"><title>jetty</title><rect width="776" height="250" fill="#0b1a24"/><rect x="24" y="40" width="728" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">J</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">jars of rope and lamp oil wait on the boards dreams of just past the last plank the water starts</text><rect x="24" y="74" width="728" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">every light needs someone to return shelters and so I came back with a lantern</text><rect x="24" y="108" width="728" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">T</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">the end of the jetty is another beginning dreams of then begin again where the water starts</text><rect x="24" y="142" width="728" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">T</text><text x="64" y="161" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">there is a morning after the jetty remembers tonight I keep the lamp so the morning can find us</text><rect x="24" y="176" width="728" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="198" fill="#ead9af" font-size="18" font-family="Georgia, serif">Y</text><text x="64" y="195" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">you shelters lit</text></svg>