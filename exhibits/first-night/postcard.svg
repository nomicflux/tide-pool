<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="532" viewBox="0 0 1100 532">
<title>Tide Pool — a coast that remembers</title>
<rect width="1100" height="532" fill="#475b61"/>
<g fill="#ead9af" font-family="Georgia, serif">
<text x="65" y="75" font-size="32">A coast that remembers</text>
<text x="65" y="110" font-size="16">fog water</text>
<circle cx="110" cy="175" r="3"/>
<text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">the room we left</tspan><tspan x="110" dy="26">behind</tspan></text>
<circle cx="320" cy="187" r="3"/>
<text x="320" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">a name under the</tspan><tspan x="320" dy="26">tongue</tspan></text>
<circle cx="530" cy="199" r="3"/>
<text x="530" y="229" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="530" dy="0">the last train</tspan><tspan x="530" dy="26">home</tspan></text>
<circle cx="740" cy="175" r="3"/>
<text x="740" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="740" dy="0">the key that</tspan><tspan x="740" dy="26">fits no door</tspan></text>
<circle cx="950" cy="187" r="3"/>
<text x="950" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="950" dy="0">the bell below</tspan><tspan x="950" dy="26">the harbour</tspan></text>
<circle cx="110" cy="325" r="3"/>
<text x="110" y="355" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">the light across</tspan><tspan x="110" dy="26">the water</tspan></text>
</g>
<path d="M 65 462 Q 300 427 550 462 T 1035 462" fill="none" stroke="#5c9392"/>
</svg>