<svg xmlns="http://www.w3.org/2000/svg" width="762" height="216" viewBox="0 0 762 216"><title>quay</title><rect width="762" height="216" fill="#0b1a24"/><rect x="24" y="40" width="714" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">Q</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">quiet hands untie the morning boat dreams of quarter past the bell the water turns</text><rect x="24" y="74" width="714" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">U</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">unlit lanterns wait for the evening ferry remembers under the quay the old rope keeps its knot</text><rect x="24" y="108" width="714" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">A</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">and cork listens</text><rect x="24" y="142" width="714" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">Y</text><text x="64" y="161" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">you shelters lit</text></svg>