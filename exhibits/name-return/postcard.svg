<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="432" viewBox="0 0 1100 432">
<title>Tide Pool — a coast that remembers</title>
<rect width="1100" height="432" fill="#102d38"/>
<g fill="#ead9af" font-family="Georgia, serif">
<text x="65" y="75" font-size="32">A coast that remembers</text>
<text x="65" y="110" font-size="16">calm water</text>
<g>
<circle cx="110" cy="175" r="3"/>
<text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">a name left</tspan><tspan x="110" dy="26">drying beside</tspan><tspan x="110" dy="26">the door</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="320" cy="187" r="3"/>
<text x="320" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">a name that</tspan><tspan x="320" dy="26">still answers to</tspan><tspan x="320" dy="26">the sea</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="530" cy="199" r="3"/>
<text x="530" y="229" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="530" dy="0">the name Alice</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
</g>
</g>
<path d="M 65 362 Q 300 327 550 362 T 1035 362" fill="none" stroke="#5c9392"><animate attributeName="d" values="M 65 362 Q 300 327 550 362 T 1035 362;M 65 362 Q 300 382 550 362 T 1035 362;M 65 362 Q 300 327 550 362 T 1035 362" dur="9s" repeatCount="indefinite"/></path>
</svg>