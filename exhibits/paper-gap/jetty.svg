<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250"><title>PAPER</title><rect width="720" height="250" fill="#0b1a24"/><rect x="24" y="40" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">P</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">pilings driven where the windows shine becomes one for each keeper</text><rect x="24" y="74" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">A</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">and cork listens</text><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">P</text><rect x="24" y="142" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="161" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">every light needs someone to return shelters and so I came back with a lantern</text><rect x="24" y="176" width="672" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="198" fill="#ead9af" font-size="18" font-family="Georgia, serif">R</text><text x="64" y="195" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">rope from the last post to the lamp remembers and both keepers walk out together</text></svg>