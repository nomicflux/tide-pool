<svg xmlns="http://www.w3.org/2000/svg" width="769" height="318" viewBox="0 0 769 318"><title>keepers</title><rect width="769" height="318" fill="#0b1a24"/><rect x="24" y="40" width="721" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">K</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">keep the lamp lit for the hundred and first dreams of keepers carry the light one plank farther</text><rect x="24" y="74" width="721" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">every light needs someone to return shelters and so I came back with a lantern</text><rect x="24" y="108" width="721" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">each keeper who reads this owes the jetty an E dreams of every returning lantern leaves a mark</text><rect x="24" y="142" width="721" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">P</text><text x="64" y="161" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">pilings driven where the windows shine becomes one for each keeper</text><rect x="24" y="176" width="721" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="198" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="195" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">even the empty windows face the water becomes each remembered name needs somewhere to stand</text><rect x="24" y="210" width="721" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="232" fill="#ead9af" font-size="18" font-family="Georgia, serif">R</text><text x="64" y="229" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">rope from the last post to the lamp remembers and both keepers walk out together</text><rect x="24" y="244" width="721" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="266" fill="#ead9af" font-size="18" font-family="Georgia, serif">S</text><text x="64" y="263" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">so am I, in the window across the water remembers the tide has learned our addresses</text></svg>