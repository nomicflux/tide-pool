<svg xmlns="http://www.w3.org/2000/svg" width="825" height="284" viewBox="0 0 825 284"><title>VOYAGE</title><rect width="825" height="284" fill="#0b1a24"/><rect x="24" y="40" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">V</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">visitors fold the coast into their pockets becomes vessels leave room for the weather they have not met</text><rect x="24" y="74" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">O</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">over the water I carried it becomes the last letter is yours to bring</text><rect x="24" y="108" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">Y</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">you shelters lit</text><rect x="24" y="142" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">A</text><text x="64" y="161" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">and cork listens</text><rect x="24" y="176" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="198" fill="#ead9af" font-size="18" font-family="Georgia, serif">G</text><text x="64" y="195" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">gulls write the first word on the sand becomes grey water warms toward morning</text><rect x="24" y="210" width="777" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="232" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="229" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">every light needs someone to return shelters and so I came back with a lantern</text></svg>