<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="532" viewBox="0 0 1100 532">
<title>Tide Pool — a coast that remembers</title>
<rect width="1100" height="532" fill="#102d38"/>
<g fill="#ead9af" font-family="Georgia, serif">
<text x="65" y="75" font-size="32">A coast that remembers</text>
<text x="65" y="110" font-size="16">calm water</text>
<g>
<circle cx="110" cy="175" r="3"/>
<text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">the key between</tspan><tspan x="110" dy="26">us</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="320" cy="187" r="3"/>
<text x="320" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">bread for Bob</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="530" cy="199" r="3"/>
<text x="530" y="229" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="530" dy="0">a cup gone cold</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="740" cy="175" r="3"/>
<text x="740" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="740" dy="0">a</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="8s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="950" cy="187" r="3"/>
<text x="950" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="950" dy="0">cold</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="110" cy="325" r="3"/>
<text x="110" y="355" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">and</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="320" cy="301" r="3"/>
<text x="320" y="331" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">cup</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="530" cy="313" r="3"/>
<text x="530" y="343" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="530" dy="0">listens</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="8s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="740" cy="325" r="3"/>
<text x="740" y="355" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="740" dy="0">a chair pulled</tspan><tspan x="740" dy="26">out</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="950" cy="301" r="3"/>
<text x="950" y="331" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="950" dy="0">gone</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</g>
</g>
<path d="M 65 462 Q 300 427 550 462 T 1035 462" fill="none" stroke="#5c9392"><animate attributeName="d" values="M 65 462 Q 300 427 550 462 T 1035 462;M 65 462 Q 300 482 550 462 T 1035 462;M 65 462 Q 300 427 550 462 T 1035 462" dur="9s" repeatCount="indefinite"/></path>
</svg>