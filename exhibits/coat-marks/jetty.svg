<svg xmlns="http://www.w3.org/2000/svg" width="888" height="964" viewBox="0 0 888 964"><title>abcdefghijklmnopqrstuvwxyz</title><rect width="888" height="964" fill="#0b1a24"/><rect x="24" y="40" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="62" fill="#ead9af" font-size="18" font-family="Georgia, serif">A</text><text x="64" y="59" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">and cork listens</text><rect x="24" y="74" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="96" fill="#ead9af" font-size="18" font-family="Georgia, serif">B</text><text x="64" y="93" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">bring a plank with your name on it becomes one plank for every letter</text><rect x="24" y="108" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="130" fill="#ead9af" font-size="18" font-family="Georgia, serif">C</text><text x="64" y="127" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">cloth shatters sky</text><rect x="24" y="142" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="164" fill="#ead9af" font-size="18" font-family="Georgia, serif">D</text><text x="64" y="161" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">doorstep shelters meet me at the harbour steps</text><rect x="24" y="176" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="198" fill="#ead9af" font-size="18" font-family="Georgia, serif">E</text><text x="64" y="195" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">every light needs someone to return shelters and so I came back with a lantern</text><rect x="24" y="210" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="232" fill="#ead9af" font-size="18" font-family="Georgia, serif">F</text><text x="64" y="229" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">from becomes here</text><rect x="24" y="244" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="266" fill="#ead9af" font-size="18" font-family="Georgia, serif">G</text><text x="64" y="263" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">gulls write the first word on the sand becomes grey water warms toward morning</text><rect x="24" y="278" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="300" fill="#ead9af" font-size="18" font-family="Georgia, serif">H</text><text x="64" y="297" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">hammer waits beneath I came to the steps and left the cork in the doorstep</text><rect x="24" y="312" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="334" fill="#ead9af" font-size="18" font-family="Georgia, serif">I</text><text x="64" y="331" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">I found the kettle warm and left the lamp lit for you dreams of a cup set beside the lamp</text><rect x="24" y="346" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="368" fill="#ead9af" font-size="18" font-family="Georgia, serif">J</text><text x="64" y="365" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">jars of rope and lamp oil wait on the boards dreams of just past the last plank the water starts</text><rect x="24" y="380" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="402" fill="#ead9af" font-size="18" font-family="Georgia, serif">K</text><text x="64" y="399" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">keep the lamp lit for the hundred and first dreams of keepers carry the light one plank farther</text><rect x="24" y="414" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="436" fill="#ead9af" font-size="18" font-family="Georgia, serif">L</text><text x="64" y="433" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">lamp dreams of lamp</text><rect x="24" y="448" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="470" fill="#ead9af" font-size="18" font-family="Georgia, serif">M</text><text x="64" y="467" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">meet me at the end of the jetty remembers I waited until the water stopped looking like distance</text><rect x="24" y="482" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="504" fill="#ead9af" font-size="18" font-family="Georgia, serif">N</text><text x="64" y="501" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">nothing ends where a lamp is lit remembers new planks smell of salt and pine</text><rect x="24" y="516" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="538" fill="#ead9af" font-size="18" font-family="Georgia, serif">O</text><text x="64" y="535" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">over the water I carried it becomes the last letter is yours to bring</text><rect x="24" y="550" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="572" fill="#ead9af" font-size="18" font-family="Georgia, serif">P</text><text x="64" y="569" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">pilings driven where the windows shine becomes one for each keeper</text><rect x="24" y="584" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="606" fill="#ead9af" font-size="18" font-family="Georgia, serif">Q</text><text x="64" y="603" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">quiet hands untie the morning boat dreams of quarter past the bell the water turns</text><rect x="24" y="618" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="640" fill="#ead9af" font-size="18" font-family="Georgia, serif">R</text><text x="64" y="637" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">rope from the last post to the lamp remembers and both keepers walk out together</text><rect x="24" y="652" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="674" fill="#ead9af" font-size="18" font-family="Georgia, serif">S</text><text x="64" y="671" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">so am I, in the window across the water remembers the tide has learned our addresses</text><rect x="24" y="686" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="708" fill="#ead9af" font-size="18" font-family="Georgia, serif">T</text><text x="64" y="705" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">the end of the jetty is another beginning dreams of then begin again where the water starts</text><rect x="24" y="720" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="742" fill="#ead9af" font-size="18" font-family="Georgia, serif">U</text><text x="64" y="739" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">unlit lanterns wait for the evening ferry remembers under the quay the old rope keeps its knot</text><rect x="24" y="754" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="776" fill="#ead9af" font-size="18" font-family="Georgia, serif">V</text><text x="64" y="773" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">visitors fold the coast into their pockets becomes vessels leave room for the weather they have not met</text><rect x="24" y="788" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="810" fill="#ead9af" font-size="18" font-family="Georgia, serif">W</text><text x="64" y="807" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">warm dreams of set</text><rect x="24" y="822" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="844" fill="#ead9af" font-size="18" font-family="Georgia, serif">X</text><text x="64" y="841" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">xylophone of icicles along the boathouse eaves dreams of x marks where the ferry turned for home</text><rect x="24" y="856" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="878" fill="#ead9af" font-size="18" font-family="Georgia, serif">Y</text><text x="64" y="875" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">you shelters lit</text><rect x="24" y="890" width="840" height="28" rx="3" fill="#7a5b3a"/><text x="36" y="912" fill="#ead9af" font-size="18" font-family="Georgia, serif">Z</text><text x="64" y="909" fill="#f6e7b8" font-size="13" font-family="Georgia, serif">zero on the tide clock and the water holds its breath shelters zigzag footprints cross the wet sand to the steps</text></svg>