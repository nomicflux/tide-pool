<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="458" viewBox="0 0 1100 458">
<title>Tide Pool — a coast that remembers</title>
<rect width="1100" height="458" fill="#102d38"/>
<g fill="#ead9af" font-family="Georgia, serif">
<text x="65" y="75" font-size="32">A coast that remembers</text>
<text x="65" y="110" font-size="16">calm water</text>
<g>
<circle cx="110" cy="175" r="3"/>
<text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">both hands are</tspan><tspan x="110" dy="26">still in the air</tspan><tspan x="110" dy="26">when the boat</tspan><tspan x="110" dy="26">turns</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="320" cy="187" r="3"/>
<text x="320" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">sixty tides and</tspan><tspan x="320" dy="26">the ferry keeps</tspan><tspan x="320" dy="26">its timetable</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</g>
</g>
<path d="M 65 388 Q 300 353 550 388 T 1035 388" fill="none" stroke="#5c9392"><animate attributeName="d" values="M 65 388 Q 300 353 550 388 T 1035 388;M 65 388 Q 300 408 550 388 T 1035 388;M 65 388 Q 300 353 550 388 T 1035 388" dur="9s" repeatCount="indefinite"/></path>
</svg>