<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="506" viewBox="0 0 1100 506">
<title>Tide Pool — a coast that remembers</title>
<rect width="1100" height="506" fill="#102d38"/>
<g fill="#ead9af" font-family="Georgia, serif">
<text x="65" y="75" font-size="32">A coast that remembers</text>
<text x="65" y="110" font-size="16">calm water</text>
<g>
<circle cx="110" cy="175" r="3"/>
<text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">Alice</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="320" cy="187" r="3"/>
<text x="320" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">Bob</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="530" cy="199" r="3"/>
<text x="530" y="229" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="530" dy="0">chair</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="740" cy="175" r="3"/>
<text x="740" y="205" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="740" dy="0">remembers</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="8s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="950" cy="187" r="3"/>
<text x="950" y="217" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="950" dy="0">out</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="110" cy="299" r="3"/>
<text x="110" y="329" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="110" dy="0">a</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="320" cy="275" r="3"/>
<text x="320" y="305" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="320" dy="0">pulled</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="530" cy="287" r="3"/>
<text x="530" y="317" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="530" dy="0">thank you for</tspan><tspan x="530" dy="26">the bread</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="8s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="740" cy="299" r="3"/>
<text x="740" y="329" text-anchor="middle" font-family="monospace" font-size="20"><tspan x="740" dy="0">gone</tspan></text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
</g>
</g>
<path d="M 65 436 Q 300 401 550 436 T 1035 436" fill="none" stroke="#5c9392"><animate attributeName="d" values="M 65 436 Q 300 401 550 436 T 1035 436;M 65 436 Q 300 456 550 436 T 1035 436;M 65 436 Q 300 401 550 436 T 1035 436" dur="9s" repeatCount="indefinite"/></path>
